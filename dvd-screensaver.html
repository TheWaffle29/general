<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050609">
  <title>DVD Screensaver</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050609;
      color: #f3f5fa;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(32, 39, 58, .34), transparent 58%),
        #050609;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #logo {
      position: absolute;
      left: 0;
      top: 0;
      width: 220px;
      height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px color-mix(in srgb, var(--logo-color) 45%, transparent));
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    .toolbar {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(760px, calc(100vw - 28px));
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 16px;
      background: rgba(17, 19, 26, .83);
      box-shadow: 0 16px 50px rgba(0, 0, 0, .38);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
      transition: opacity .25s ease, transform .25s ease;
    }

    .toolbar.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
    }

    .brand {
      min-width: 116px;
      padding: 0 8px;
    }

    .brand strong {
      display: block;
      font-size: 13px;
      letter-spacing: .02em;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: #959baa;
      font-size: 11px;
    }

    button, .upload-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 10px;
      background: #242733;
      color: #f4f5f8;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }

    button:hover, .upload-button:hover {
      border-color: rgba(255, 255, 255, .25);
      background: #303442;
    }

    button:active, .upload-button:active { transform: scale(.97); }
    button:focus-visible, .upload-button:focus-visible, input:focus-visible {
      outline: 2px solid #91a7ff;
      outline-offset: 3px;
    }

    .upload-button {
      border-color: #687df0;
      background: #596ee6;
    }

    .upload-button:hover { background: #6a7df0; }
    #image-upload { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .control {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 2px 9px;
      min-width: 110px;
      padding: 0 5px;
      color: #bdc2cf;
      font-size: 11px;
    }

    .control output {
      justify-self: end;
      color: #f4f5f8;
      font-variant-numeric: tabular-nums;
    }

    .control input { grid-column: 1 / -1; width: 100%; accent-color: #8797ff; }
    .spacer { flex: 1; }
    .icon { width: 15px; height: 15px; fill: currentColor; }

    .hint {
      position: fixed;
      top: 24px;
      left: 50%;
      color: rgba(231, 234, 243, .46);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      transform: translateX(-50%);
      pointer-events: none;
      transition: opacity .2s ease;
    }

    #stage.dragging::after {
      position: absolute;
      inset: 18px;
      display: grid;
      place-items: center;
      border: 2px dashed rgba(139, 158, 255, .8);
      border-radius: 20px;
      background: rgba(66, 83, 164, .12);
      color: #e4e9ff;
      content: "Drop an image to use it";
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 600;
      pointer-events: none;
    }

    @media (max-width: 680px) {
      .toolbar { flex-wrap: wrap; gap: 8px; bottom: 12px; }
      .brand { flex: 1; }
      .control { flex: 1 1 120px; }
      .spacer { display: none; }
      .hint { top: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="DVD screensaver animation">
    <img id="logo" alt="DVD Video logo">
  </main>
  <div class="hint" id="hint">A little nostalgia, full screen</div>

  <section class="toolbar" id="toolbar" aria-label="Screensaver controls">
    <div class="brand">
      <strong>DVD Screensaver</strong>
      <span id="image-name">The classic logo</span>
    </div>
    <label class="upload-button" for="image-upload">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 18a4 4 0 0 0 .4-7.98A6.5 6.5 0 0 0 7 8.5c0 .17.01.34.03.5A4.5 4.5 0 0 0 7.5 18H10v-2H7.5a2.5 2.5 0 0 1-.2-4.99l1.37-.11-.17-1.36A4.5 4.5 0 0 1 17.45 9l.17 1.18 1.19-.16A2 2 0 0 1 19 14h-2v2h2v2Zm-6-8-4 4h3v6h2v-6h3l-4-4Z"/></svg>
      Choose image
    </label>
    <input id="image-upload" type="file" accept="image/*">
    <label class="control">
      <span>Size</span><output id="size-value">220 px</output>
      <input id="size" type="range" min="90" max="420" value="220" aria-label="Logo size">
    </label>
    <label class="control">
      <span>Speed</span><output id="speed-value">1.0×</output>
      <input id="speed" type="range" min="30" max="240" value="100" aria-label="Bounce speed">
    </label>
    <span class="spacer"></span>
    <button id="pause" type="button" aria-label="Pause animation">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
      Pause
    </button>
    <button id="fullscreen" type="button" aria-label="Enter fullscreen">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>
      Fullscreen
    </button>
  </section>

  <script>
    (() => {
      const stage = document.querySelector("#stage");
      const logo = document.querySelector("#logo");
      const toolbar = document.querySelector("#toolbar");
      const hint = document.querySelector("#hint");
      const upload = document.querySelector("#image-upload");
      const sizeSlider = document.querySelector("#size");
      const speedSlider = document.querySelector("#speed");
      const sizeValue = document.querySelector("#size-value");
      const speedValue = document.querySelector("#speed-value");
      const pauseButton = document.querySelector("#pause");
      const fullscreenButton = document.querySelector("#fullscreen");
      const imageName = document.querySelector("#image-name");

      const colors = ["#55d8ff", "#ff5f87", "#ffd34e", "#8eff75", "#ba8aff", "#ff914d"];
      const dvdSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
        <defs>
          <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".98"/>
            <stop offset=".48" stop-color="#fff" stop-opacity=".8"/>
            <stop offset="1" stop-color="#fff" stop-opacity=".96"/>
          </linearGradient>
        </defs>
        <g fill="url(#shine)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-style="italic">
          <text x="220" y="160" text-anchor="middle" font-size="132" letter-spacing="-13">DVD</text>
          <path d="M108 174c34 20 190 20 224 0-19 35-205 35-224 0Z" opacity=".95"/>
          <text x="220" y="218" text-anchor="middle" font-size="32" letter-spacing="10">VIDEO</text>
        </g>
      </svg>`;
      const defaultUrl = URL.createObjectURL(new Blob([dvdSvg], { type: "image/svg+xml" }));
      let imageUrl = defaultUrl;
      let x = 70;
      let y = 70;
      let vx = 190;
      let vy = 145;
      let paused = false;
      let lastTime = 0;
      let lastPointerActivity = 0;
      let currentColor = -1;
      let naturalWidth = 440;
      let naturalHeight = 280;
      let objectUrl = null;
      let colorUrl = null;

      function dimensions() {
        const maxWidth = Math.max(50, window.innerWidth * 0.8);
        const maxHeight = Math.max(50, window.innerHeight * 0.65);
        const factor = Math.min(Number(sizeSlider.value) / 220, maxWidth / naturalWidth, maxHeight / naturalHeight);
        return { width: naturalWidth * factor, height: naturalHeight * factor };
      }

      function placeLogo() {
        const { width, height } = dimensions();
        x = Math.max(0, Math.min(x, window.innerWidth - width));
        y = Math.max(0, Math.min(y, window.innerHeight - height));
        logo.style.width = `${width}px`;
        logo.style.height = `${height}px`;
        logo.style.transform = `translate(${x}px, ${y}px)`;
      }

      function changeColor() {
        currentColor = (currentColor + 1) % colors.length;
        logo.style.setProperty("--logo-color", colors[currentColor]);
        logo.style.filter = `drop-shadow(0 0 18px ${colors[currentColor]}70)`;
        if (imageUrl === defaultUrl) {
          if (colorUrl) URL.revokeObjectURL(colorUrl);
          colorUrl = URL.createObjectURL(new Blob(
            [dvdSvg.replaceAll("#fff", colors[currentColor])],
            { type: "image/svg+xml" }
          ));
          logo.src = colorUrl;
        }
      }

      function animate(time) {
        if (!paused) {
          const delta = lastTime ? Math.min((time - lastTime) / 1000, 0.05) : 0;
          const { width, height } = dimensions();
          const speed = Number(speedSlider.value) / 100;
          x += vx * speed * delta;
          y += vy * speed * delta;
          const maxX = Math.max(0, window.innerWidth - width);
          const maxY = Math.max(0, window.innerHeight - height);

          if (x <= 0 || x >= maxX) {
            x = Math.max(0, Math.min(x, maxX));
            vx *= -1;
            changeColor();
          }
          if (y <= 0 || y >= maxY) {
            y = Math.max(0, Math.min(y, maxY));
            vy *= -1;
            changeColor();
          }
          placeLogo();
        }
        lastTime = time;
        requestAnimationFrame(animate);
      }

      function loadImage(file) {
        if (!file || !file.type.startsWith("image/")) return;
        const nextUrl = URL.createObjectURL(file);
        const probe = new Image();
        probe.onload = () => {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          objectUrl = nextUrl;
          imageUrl = nextUrl;
          naturalWidth = probe.naturalWidth;
          naturalHeight = probe.naturalHeight;
          logo.src = imageUrl;
          imageName.textContent = file.name;
          changeColor();
          placeLogo();
        };
        probe.onerror = () => URL.revokeObjectURL(nextUrl);
        probe.src = nextUrl;
      }

      upload.addEventListener("change", (event) => {
        loadImage(event.target.files[0]);
        event.target.value = "";
      });

      sizeSlider.addEventListener("input", () => {
        sizeValue.value = `${sizeSlider.value} px`;
        placeLogo();
      });

      speedSlider.addEventListener("input", () => {
        speedValue.value = `${(Number(speedSlider.value) / 100).toFixed(1)}×`;
      });

      pauseButton.addEventListener("click", () => {
        paused = !paused;
        pauseButton.innerHTML = paused
          ? '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 12 7-12 7z"/></svg> Resume'
          : '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg> Pause';
        pauseButton.setAttribute("aria-label", paused ? "Resume animation" : "Pause animation");
      });

      fullscreenButton.addEventListener("click", async () => {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      });

      document.addEventListener("fullscreenchange", () => {
        fullscreenButton.innerHTML = document.fullscreenElement
          ? '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg> Exit fullscreen'
          : '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg> Fullscreen';
      });

      stage.addEventListener("dragover", (event) => {
        event.preventDefault();
        stage.classList.add("dragging");
      });
      stage.addEventListener("dragleave", (event) => {
        if (!stage.contains(event.relatedTarget)) stage.classList.remove("dragging");
      });
      stage.addEventListener("drop", (event) => {
        event.preventDefault();
        stage.classList.remove("dragging");
        loadImage(event.dataTransfer.files[0]);
      });

      document.addEventListener("pointermove", () => {
        lastPointerActivity = performance.now();
        toolbar.classList.remove("is-hidden");
        hint.style.opacity = "1";
      });
      document.addEventListener("pointerleave", () => {
        toolbar.classList.add("is-hidden");
        hint.style.opacity = "0";
      });
      document.addEventListener("keydown", (event) => {
        if (event.code === "Space" && !["INPUT", "BUTTON"].includes(document.activeElement.tagName)) {
          event.preventDefault();
          pauseButton.click();
        }
        if (event.key === "Escape") toolbar.classList.remove("is-hidden");
      });
      setInterval(() => {
        if (performance.now() - lastPointerActivity > 3500 && document.fullscreenElement) {
          toolbar.classList.add("is-hidden");
          hint.style.opacity = "0";
        }
      }, 700);
      window.addEventListener("resize", placeLogo);
      window.addEventListener("beforeunload", () => {
        URL.revokeObjectURL(defaultUrl);
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        if (colorUrl) URL.revokeObjectURL(colorUrl);
      });

      logo.src = defaultUrl;
      changeColor();
      placeLogo();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
