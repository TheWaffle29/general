<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shuffle</title>
  <style>
    html,
    body,
    iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
    }

    body {
      overflow: hidden;
    }

    .controls {
      position: fixed;
      right: 16px;
      bottom: 16px;
      left: 16px;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 14px;
      background: rgb(18 24 38 / 82%);
      box-shadow: 0 8px 28px rgb(0 0 0 / 24%);
      backdrop-filter: blur(12px);
    }

    .progress-bars {
      display: flex;
      flex: 1;
      gap: 7px;
    }

    .progress-track {
      height: 5px;
      flex: 1;
      overflow: hidden;
      border-radius: 999px;
      background: rgb(255 255 255 / 32%);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #fff;
    }

    #pause-button {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: #172033;
      background: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }

    #pause-button:focus-visible {
      outline: 3px solid #8ab4ff;
      outline-offset: 3px;
    }

    #pause-button .icon {
      display: block;
      width: 20px;
      height: 20px;
      margin: auto;
      fill: currentColor;
    }

    #pause-button .icon-play,
    #pause-button.is-paused .icon-pause {
      display: none;
    }

    #pause-button.is-paused .icon-play {
      display: block;
    }

    @media (max-width: 480px) {
      .controls {
        right: 10px;
        bottom: 10px;
        left: 10px;
        gap: 10px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <iframe id="page" title="Rotating website"></iframe>
  <div class="controls">
    <div class="progress-bars" id="progress-bars" aria-label="Time until next page"></div>
    <button id="pause-button" type="button" aria-label="Pause slideshow" aria-pressed="false">
      <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
      <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8a1 1 0 0 1 1.5-.86l11 6.35a2 2 0 0 1 0 3.46l-11 6.35A1 1 0 0 1 7 19.24z"></path></svg>
    </button>
  </div>
  <script>
    const pages = [
      "weather.html",
      "https://www.google.com",
      "https://wikipedia.org"
    ];
    const interval = 10_000;
    let index = 0;
    let remaining = interval;
    let startedAt = performance.now();
    let animationFrame;
    let paused = false;
    const frame = document.getElementById("page");
    const progressBars = document.getElementById("progress-bars");
    const pauseButton = document.getElementById("pause-button");
    const fills = pages.map(() => {
      const track = document.createElement("div");
      track.className = "progress-track";
      track.setAttribute("aria-hidden", "true");
      const fill = document.createElement("div");
      fill.className = "progress-fill";
      track.append(fill);
      progressBars.append(track);
      return fill;
    });

    function showPage(animate = false) {
      frame.src = pages[index];
      if (animate && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        frame.animate(
          [
            { transform: "translateX(12px)", opacity: 0.9 },
            { transform: "translateX(0)", opacity: 1 }
          ],
          { duration: 600, easing: "cubic-bezier(0.22, 0.61, 0.36, 1)" }
        );
      }
    }

    function renderProgress(timeLeft) {
      const currentProgress = 1 - timeLeft / interval;
      fills.forEach((fill, pageIndex) => {
        const progress = pageIndex < index ? 1 : pageIndex === index ? currentProgress : 0;
        fill.style.width = `${Math.max(0, Math.min(1, progress)) * 100}%`;
      });
    }

    function tick(now) {
      if (paused) return;

      const timeLeft = remaining - (now - startedAt);
      if (timeLeft <= 0) {
        index = (index + 1) % pages.length;
        remaining = interval;
        startedAt = now;
        showPage(true);
        renderProgress(remaining);
      } else {
        renderProgress(timeLeft);
      }
      animationFrame = requestAnimationFrame(tick);
    }

    pauseButton.addEventListener("click", () => {
      paused = !paused;
      pauseButton.classList.toggle("is-paused", paused);
      pauseButton.setAttribute("aria-label", paused ? "Resume slideshow" : "Pause slideshow");
      pauseButton.setAttribute("aria-pressed", String(paused));

      if (paused) {
        remaining = Math.max(0, remaining - (performance.now() - startedAt));
        cancelAnimationFrame(animationFrame);
        renderProgress(remaining);
      } else {
        startedAt = performance.now();
        animationFrame = requestAnimationFrame(tick);
      }
    });

    showPage();
    renderProgress(remaining);
    animationFrame = requestAnimationFrame(tick);
  </script>
</body>
</html>
